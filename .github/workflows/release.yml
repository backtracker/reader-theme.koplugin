name: release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build plugin zip
        run: bash package.sh

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            range="$prev..$GITHUB_REF_NAME"
          else
            range="${GITHUB_REF_NAME}^..${GITHUB_REF_NAME}"
          fi
          {
            echo "## 变更"
            echo
            git log --no-merges --pretty=format:'- %s (%h)' "$range"
            echo
            echo
            echo "## 安装"
            echo
            echo '下载 `reader-theme.koplugin.zip`，解压后将 `reader-theme.koplugin` 放入 KOReader 的 `plugins/` 目录并重启。'
          } > /tmp/release-notes.md
          cat /tmp/release-notes.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: reader-theme.koplugin
          path: /tmp/reader-theme.koplugin.zip
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/reader-theme.koplugin.zip
          body_path: /tmp/release-notes.md
          fail_on_unmatched_files: true
